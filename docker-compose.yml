services:
  scanner:
    ## image: derhenning/tgtg:latest-alpine
    ## pre build image from docker hub
    ## image: tgtg-scanner:latest                   ## locally build image
    build:                                       ## build image with compose
       context: .
       dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      TELEGRAM: true
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_ID}
      SLEEP_TIME: 60
      TZ: Europe/Berlin
      LOCALE: de_DE
      METRICS: true
      METRICS_PORT: "8000"
    volumes:
      - tokens:/tokens
      - alertprice_data:/alertprice_data
    ports:
      # Expose the metrics port to the host and other containers
      - "8000:8000"
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana:12.2
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - .env
    depends_on:
      - prometheus

volumes:
  prom_data:
  tokens:
  grafana-storage:
  alertprice_data:
