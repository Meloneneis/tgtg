apiVersion: 1

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: telegram_alerts
        object_matchers:
          - ['grafana_folder', '=', 'Price Alerts']
        group_by:
          - '...'
        group_wait: 0s
        group_interval: 1s
        repeat_interval: 12h
